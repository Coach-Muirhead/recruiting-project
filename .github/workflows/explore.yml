name: Sample source pages
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/sample_sources.py
      - name: Save samples to the "samples" branch
        run: |
          git config user.name "recruiting-bot"; git config user.email "recruiting-bot@users.noreply.github.com"
          git checkout --orphan samples-out && git rm -rqf . && git add samples && git commit -qm "Source samples $(date +%F)" && git push -f origin samples-out:samples
