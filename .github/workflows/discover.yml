name: Discover programs
on:
  workflow_dispatch:
    inputs:
      levels: { description: "Lists to read (d1,d2,d3,naia,njcaa1,njcaa2,njcaa3,nwac,cccaa)", default: "d1,d2,d3,naia,njcaa1,njcaa2,njcaa3,nwac,cccaa" }
      limit: { description: "Programs per list (0 = all; small numbers for a test)", default: "0" }
permissions: { contents: write }
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/discover.py --levels "${{ inputs.levels }}" --limit "${{ inputs.limit }}"
        env: { SCORECARD_API_KEY: "${{ secrets.SCORECARD_API_KEY }}" }
      - name: Save the master list
        run: |
          git config user.name "recruiting-bot"; git config user.email "recruiting-bot@users.noreply.github.com"
          git add scraper/schools.csv data/discovered.csv data/discovery_summary.json
          git diff --cached --quiet || git commit -m "Discovery run $(date +%F)"
          git pull --rebase -X theirs origin main || true
          git push
